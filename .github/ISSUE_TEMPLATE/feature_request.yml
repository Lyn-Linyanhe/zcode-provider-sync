name: 功能建议
description: 想要新功能或改进现有交互
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景和痛点，再说功能。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选
